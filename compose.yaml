name: bookhub-public
x-common: &common
  build:
    context: .
    target: runtime
  image: bookhub-public:local
  env_file: .env
  environment:
    BOOKHUB_DATA: /data
    BOOKHUB_DB: /data/bookhub.sqlite3
    SYNC_USER: ${SYNC_USER:-reader}
    SYNC_PASSWORD: ${SYNC_PASSWORD:?Run python3 scripts/configure.py first}
    SYNC_API_KEY: ${SYNC_API_KEY:?Run python3 scripts/configure.py first}
  volumes:
    - ./data:/data
  restart: unless-stopped
services:
  web:
    <<: *common
    ports: ["${BOOKHUB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8088"]
    command: ["python", "-m", "uvicorn", "bookhub.application:create_web_app", "--factory", "--host", "0.0.0.0", "--port", "8088"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  sync:
    <<: *common
    ports: ["${BOOKHUB_BIND:-127.0.0.1}:${SYNC_PORT:-8089}:8089"]
    command: ["python", "-m", "uvicorn", "bookhub.application:create_sync_app", "--factory", "--host", "0.0.0.0", "--port", "8089"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *common
    command: ["python", "-m", "bookhub.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "bookhub.check"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
